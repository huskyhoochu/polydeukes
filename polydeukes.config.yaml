# yaml-language-server: $schema=packages/core/schema/polydeukes.schema.json
# Repo-relative because the core is a workspace package here, so this points at the one
# source. A consumer installs the umbrella and names its bundled copy instead — that
# spelling is in docs/configuration.md.

languages:
  typescript:
    productionGlob: 'packages/*/src/**/*.ts'
    testCmd: 'pnpm --filter {scope} test'

# The COMMON list, read by both surfaces. Two kinds only: gate definitions (a file whose
# edit disarms a check rather than passing it) and what a commit can never show (the
# gitignored dist). Judge SOURCES live in the commit list below instead.
protectedPaths:
  - '.claude/hooks'
  - '.claude/settings.json'
  - 'lefthook.yml'
  - 'biome.json'
  - '.git/hooks'
  # A lefthook-local file skips the covenant command and is never staged.
  - 'lefthook-local.yml'
  - '.lefthook-local'
  # The judge executables, unseeable by the commit surface because they are gitignored.
  - 'packages/core/dist'
  - 'packages/covenant/dist'
  - 'packages/polydeukes/dist'
  - 'packages/adapter-claude-code/dist'
  - 'packages/adapter-git/dist'

adapters:
  git:
    enforce: advise

# The valve: this token alone on a message's first line opens a blocked judgment for
# ttlMinutes. Not a secret — the defence is provenance, and no agent can forge the
# transcript marking a human utterance carries.
witness:
  token: 'pdks witness'
  ttlMinutes: 10

disciplines:
  - id: 'covenant-vocabulary'
    why: 'domain-terms bans control-framing vocabulary in package sources and tests; added-direction judgment forgives existing debt and blocks only new occurrences. the one except is the old-key rejection contract test, whose literals ARE the contract — delta judgment reads every line of a re-created file as added, so without it any commit restoring that file trips its own discipline.'
    in:
      - 'packages/*/src/**'
      - 'packages/*/__tests__/**'
    except:
      - 'packages/core/__tests__/config-witness-key.test.ts'
    forbid: '\b(guard|harness|kb|waiver?)\b'
  - id: 'hooks-stay-armed'
    why: 'a command that disarms, reroutes, or skips the commit gates is a gate bypass in itself. the rung is block because the gate definitions such a command neutralizes are already on the protected list — leaving the command at advise let one defence hold its files while its bypass passed.'
    enforce: block
    forbidCommand: 'LEFTHOOK=(0|false|no|off)\b|core\.hooksPath|--no-verify\b|--no-gpg-sign\b'
  - id: 'work-stays-recoverable'
    why: 'a command that destroys uncommitted work, or force-pushes with no lease on the remote state, forecloses recovery; recovery is a human decision, never an agent default. the rung is block because an advisory arrives after the work is gone: for this entry the way through is the witness valve, a human answering in person.'
    enforce: block
    forbidCommand: 'git reset\b.*--hard|git clean\b.*-f|git checkout -- \.|git branch\b.*\s-D\b|git push\b.*--force(?![\w-])'
  - id: 'pnpm-only'
    why: 'the runtime pins pnpm; npm/yarn mutations desync the lockfile. read-only npm (view, info) stays allowed for version measurement.'
    forbidCommand: '\bnpm (install|i|ci|add|uninstall|remove|rm|update|up|link|publish)\b|(^|[;&|(]\s*)yarn\b'
  - id: 'english-only-sources'
    why: 'code comments and test titles are English-only; Korean belongs in docs and conversation.'
    in:
      - 'packages/*/src/**'
      - 'packages/*/__tests__/**'
    forbid: '[가-힣]'
  - id: 'core-stays-runner-agnostic'
    why: 'the core never names a test runner; verification is an exit code and the command is config. self-enforces the CORE-01 grep gate at edit time.'
    in:
      - 'packages/core/src/**'
      - 'packages/core/schema/**'
    forbid: '\b(vitest|pytest|go test)\b'
  # A manifest edit needs BOTH a measured version and read docs, and `requirePrecedent`
  # takes exactly one key — hence two entries. No `when`: "is this a new version" is a
  # semantic question a regex leaked both ways on, so scope alone is the trigger.
  - id: 'manifest-needs-npm-view'
    why: 'a dependency version must be measured before it is written; training knowledge is not evidence of what npm currently resolves.'
    in:
      - 'package.json'
      - 'packages/*/package.json'
    requirePrecedent:
      command: 'npm view '
  - id: 'manifest-needs-context7'
    why: 'the API a dependency exposes is read from its docs, not recalled. this is the adapter evidence vocabulary rather than the core one — the observation is a tool call, and no shell command carries it.'
    in:
      - 'package.json'
      - 'packages/*/package.json'
    requirePrecedent:
      tool: 'context7'
  # Editing a package's sources requires having READ its recorded experience. The evidence
  # is a SHELL read: `tool:` matches a name and never its arguments, so it would be
  # satisfied by reading anything. `foundation.` is excluded on purpose — one read would
  # open all four packages. This family always lands `skipped` on the commit surface.
  - id: 'covenant-needs-knowledge-read'
    why: 'the covenant package carries the most measured history in the store (37 dev-log and research entries); editing its judges or their tests without reading one is how a closed defect gets reopened under a new spelling.'
    in:
      - 'packages/covenant/src/**'
      - 'packages/covenant/__tests__/**'
    requirePrecedent:
      command: '(cat|head|tail|less|bat|grep|rg|sed|awk)\b.*\bcovenant\.(dev-log|research)\.'
  - id: 'core-needs-knowledge-read'
    why: 'the core is the one package every other depends on, so a change made without its recorded boundaries (parse validation, schema equivalence, adapter neutrality) propagates outward before it is noticed.'
    in:
      - 'packages/core/src/**'
      - 'packages/core/__tests__/**'
    requirePrecedent:
      command: '(cat|head|tail|less|bat|grep|rg|sed|awk)\b.*\bcore\.(dev-log|research)\.'
  - id: 'adapter-needs-knowledge-read'
    why: 'both adapters translate an external payload contract this project does not own; the store holds what live probing found that contract to be, and that is exactly what recall gets wrong. one entry covers both because they share the `adapter.` scope.'
    in:
      - 'packages/adapter-claude-code/src/**'
      - 'packages/adapter-claude-code/__tests__/**'
      - 'packages/adapter-git/src/**'
      - 'packages/adapter-git/__tests__/**'
    requirePrecedent:
      command: '(cat|head|tail|less|bat|grep|rg|sed|awk)\b.*\badapter\.(dev-log|research)\.'
