# yaml-language-server: $schema=node_modules/@polydeukes/core/schema/polydeukes.schema.json

languages:
  typescript:
    productionGlob: 'packages/*/src/**/*.ts'
    testCmd: 'pnpm --filter {scope} test'

# The COMMON protection list — read by every observer that can see an entry (narrowed
# 2026-07-26; split per surface 2026-07-28, CONFIG-08). Two kinds of entries belong here:
#
#   1. Gate definitions — files whose edit disarms a check rather than passing it, at
#      whichever surface can see them. The hook wiring IS the session surface;
#      lefthook.yml IS the commit surface; biome.json sets the bar the commit surface
#      holds things to; the generated .git/hooks scripts are the commit gate's installed
#      form (git-untracked, so the session surface is the ONE layer that can watch them —
#      on the commit surface that entry is structurally vacuous, by nature not mistake).
#   2. What only one layer can see — the gitignored judge executables (dist): a commit
#      never shows them, and a poisoned judge disarms every covenant without a trace.
#
# Judge SOURCES are deliberately NOT here. They live in the commit surface's own additive
# list (adapters.git.protectedPaths below): a session edit of a source is the work itself
# (blocking it here measured 2,414 waiver bypasses against 14 real discipline blocks),
# while the commit that PROMOTES it into history is the checkpoint a human answers for.
#
# Child-process blind spot, on record (CONFIG-08 AC): `pnpm build` rewrites dist and
# `lefthook install` regenerates .git/hooks through child-process fs writes. The session
# surface judges tool declarations, not child writes, and both targets are
# gitignored/untracked, so neither layer observes either command. That is the nature of
# the observation scope (same class as COVENANT-14 §2.1), named here so it is never
# mistaken for coverage.
#
# The root config attaches itself (CONFIG-03) for the same reason. The live session
# transcript is defended too, but NOT from this list and never as a path: assembly builds it
# its own equality-judging registration (COVENANT-07c), because a file living deep under HOME
# turns HOME itself into a protected ancestor and every daily spelling that passes through it
# breaks. Do not "restore" a transcript entry here — that is the over-block, not the defence.
protectedPaths:
  - '.claude/hooks'
  - '.claude/settings.json'
  - 'lefthook.yml'
  - 'biome.json'
  - '.git/hooks'
  # The judge executables, unseeable by the commit surface because they are gitignored.
  - 'packages/core/dist'
  - 'packages/covenant/dist'
  - 'packages/polydeukes/dist'
  - 'packages/adapter-claude-code/dist'
  - 'packages/adapter-git/dist'

# The time-boxed valve. A human types this token into the conversation and the waiver
# holds for ttlMinutes from that message, then blocking resumes on its own — replacing
# an env valve whose "armed until you remember to disarm" shape measured 562 bypasses
# in a single day. The token is not a secret: the defence is provenance, not
# confidentiality. Only a real human utterance carries the transcript marking the
# predicate admits, and no agent can forge that marking.
#
# The token must stand alone on the message's first line: mentioning it mid-sentence is
# talking about the valve, not opening it (COVENANT-15). Any value works — placement is
# what is judged, never the phrase's shape.
waiver:
  token: 'pdks waive'
  ttlMinutes: 10

# Adapter namespaces (CONFIG-07): each adapter owns its own vocabulary; the core passes
# contents through verbatim. Both keys below are the git adapter's vocabulary — CONFIG-06
# opened `enforce`, CONFIG-08 opened `protectedPaths`.
#
# enforce: block — restored 2026-07-28 (CONFIG-08, executing the 2026-07-26 §5.1
# decision). A staged change to a protected path stops the commit unless a human answers
# the TTY prompt with the waiver token; an agent-spawned commit has no TTY and cannot.
# The session surface (the hook) stays blocking either way; an unjudgeable run (missing
# config, stale dist) still fails closed even here.
#
# protectedPaths (additive): the commit surface's OWN observation scope, judged on top of
# the common list above. These are the judgment chain's sources — loader, validator,
# judge bodies, and both adapters (the archived invariant names the whole chain: config,
# loader, hook, core, covenant, adapter). Editing them in a session is the work itself
# and stays free; committing them is the promotion a human vouches for. The session
# surface never reads this list — the level is the observer's, and so is the scope.
adapters:
  git:
    enforce: block
    protectedPaths:
      - 'packages/core/src'
      - 'packages/covenant/src'
      - 'packages/polydeukes/src'
      - 'packages/adapter-claude-code/src'
      - 'packages/adapter-git/src'

disciplines:
  - id: 'covenant-vocabulary'
    why: 'domain-terms bans control-framing vocabulary in package sources; added-direction judgment forgives existing debt and blocks only new occurrences.'
    in:
      - 'packages/core/src/**'
      - 'packages/covenant/src/**'
      - 'packages/adapter-claude-code/src/**'
    forbid: '\b(guard|harness|kb)\b'
  - id: 'hooks-stay-armed'
    why: 'a command that disarms, reroutes, or skips the commit gates is a gate bypass in itself.'
    forbidCommand: 'LEFTHOOK=(0|false|no|off)\b|core\.hooksPath|--no-verify\b|--no-gpg-sign\b'
  - id: 'work-stays-recoverable'
    why: 'a command that destroys uncommitted work or rewrites pushed history forecloses recovery; recovery is a human decision, never an agent default.'
    forbidCommand: 'git reset\b.*--hard|git clean\b.*-f|git checkout -- \.|git branch\b.*\s-D\b|git push\b.*--force'
  - id: 'pnpm-only'
    why: 'the runtime pins pnpm; npm/yarn mutations desync the lockfile. read-only npm (view, info) stays allowed for version measurement.'
    forbidCommand: '\bnpm (install|i|ci|add|uninstall|remove|rm|update|up|link|publish)\b|(^|[;&|(]\s*)yarn\b'
  - id: 'english-only-sources'
    why: 'code comments and test titles are English-only; Korean belongs in docs and conversation.'
    in:
      - 'packages/*/src/**'
      - 'packages/*/__tests__/**'
    forbid: '[가-힣]'
  - id: 'core-stays-runner-agnostic'
    why: 'the core never names a test runner; verification is an exit code and the command is config. self-enforces the CORE-01 grep gate at edit time.'
    in:
      - 'packages/core/src/**'
      - 'packages/core/schema/**'
    forbid: '\b(vitest|pytest|go test)\b'
  # Two entries over one scope: a manifest edit needs BOTH a measured version and read
  # docs. `requirePrecedent` takes exactly one key, so a pair of requirements is written
  # as a pair of disciplines.
  #
  # Neither carries a `when` (rewritten 2026-07-26). Three review rounds went into a regex
  # answering "is this string a new dependency version" — a semantic question asked
  # syntactically, which leaked both ways every time: it missed ranges, tags and protocol
  # forms, and once widened it caught `workspace:` and the `engines` field. Editing a
  # manifest at all is rare enough that scope alone is the cheaper, honest trigger.
  - id: 'manifest-needs-npm-view'
    why: 'a dependency version must be measured before it is written; training knowledge is not evidence of what npm currently resolves.'
    in:
      - 'package.json'
      - 'packages/*/package.json'
    requirePrecedent:
      command: 'npm view '
  - id: 'manifest-needs-context7'
    why: 'the API a dependency exposes is read from its docs, not recalled. this is the adapter evidence vocabulary rather than the core one — the observation is a tool call, and no shell command carries it.'
    in:
      - 'package.json'
      - 'packages/*/package.json'
    requirePrecedent:
      tool: 'context7'
