# PR-time test gate — the Forgejo rendering of .github/workflows/ci.yml (same gate
# sequence as publish.yml minus the upload; original rationale in that file's header).
#
# Two deliberate differences from the GitHub file. `runs-on: node-26` is this
# instance's registered runner label (Node 26 preinstalled; setup-node only installs the
# Node 24 that the last step runs the SDK contract on, the lowest Node sdk-ts supports).
# pnpm comes from corepack reading the root manifest's pinned `packageManager` — the same
# single source pnpm/action-setup reads on the GitHub side.
#
# Forgejo reads workflows from the first directory it finds among .forgejo/, .gitea/,
# and .github/ — this directory existing is what keeps the GitHub files from being
# picked up here (they name a runner label this instance does not have).
name: test

on:
  pull_request:

jobs:
  test:
    runs-on: node-26
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@v4

      # Node 25 and later no longer bundle corepack, so it is installed from npm first.
      - run: npm install --global corepack && corepack enable

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo run build

      - run: pnpm -r typecheck

      - run: node packages/sdk-ts/scripts/generate-types.mjs --check

      # A minimal stable toolchain is installed when the runner has no rustup, which the
      # cargo build below and the clippy and rustfmt steps need.
      - name: Install Rust when absent
        run: |
          command -v rustup >/dev/null || curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # Built before the tests: the end-to-end tests of sdk-ts (`pnpm -r test`) and of the
      # Rust SDK, and the Python and SDK-contract checks below, spawn target/debug/pdks.
      - run: cargo build -p pdks -p pdks-memory

      - run: pnpm -r test

      - run: node scripts/check-docs.mjs

      # The Rust SDK is not a pnpm package, so `pnpm -r test` does not reach it.
      - run: cargo test -p polydeukes-sdk

      - uses: https://github.com/astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"

      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

      # `cargo test -p pdks` runs every conformance/covenant case through
      # scripts/verify-covenant-fixtures.mjs.
      - run: cargo test -p pdks
      - run: cargo test -p pdks-claude-code
      - run: cargo test -p pdks-codex
      - run: cargo test -p pdks-memory

      - run: uv sync --project packages/sdk-python --locked --python 3.14

      - run: uv run --project packages/sdk-python --locked ruff check packages/sdk-python

      - run: uv run --project packages/sdk-python --locked ruff format --check packages/sdk-python

      - name: Python types, generated types, wheel and sdist tests
        run: >-
          uv run --project packages/sdk-python --locked python
          packages/sdk-python/scripts/verify.py
          --executable "$PWD/target/debug/pdks"
          --python 3.12 --python 3.14 --python 3.15

      - name: Compare the three SDK process contracts
        run: node scripts/verify-sdk-contract.mjs --executable "$PWD/target/debug/pdks"

      - name: Verify isolated SDK distributions and TypeScript consumer types
        run: node scripts/verify-sdk-distributions.mjs --executable "$PWD/target/debug/pdks"

      - uses: https://github.com/actions/setup-node@v7
        with:
          node-version: "24"

      - name: Compare the three SDK process contracts on Node 24
        run: node scripts/verify-sdk-contract.mjs --executable "$PWD/target/debug/pdks"
