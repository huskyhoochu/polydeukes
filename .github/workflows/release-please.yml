# Milestone-gated release automation (research: foundation.research.release-automation).
#
# release-please keeps ONE release PR open, accumulating conventional commits since the
# last release. Nothing bumps until a human merges that PR — merging it IS the milestone
# gate step ③ (lockstep bump of every package via extra-files + CHANGELOG + v0.X.0 tag +
# GitHub Release). npm publish is intentionally absent while pre-alpha; a separate
# workflow on `release published` will own it when the packages go public.
#
# The tag release-please leaves behind is LIGHTWEIGHT — it goes through the GitHub
# Releases API, which names a commit and records no tagger, date, or message (measured
# 2026-07-29 on v0.2.0). A milestone tag has to carry who declared the release and when,
# so the annotate step below replaces it in place. Do not drop that step: without it the
# tag silently degrades to a bare pointer, which is how v0.1 ended up hand-tagged days
# later.
name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write # the publish hand-off below dispatches another workflow

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Only runs on the push that merges a release PR; every other push stops above.
      - name: Check out for tag annotation
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace the lightweight tag with an annotated one
        if: ${{ steps.release.outputs.release_created }}
        # Action outputs go through env, never inline into the script (workflow injection).
        env:
          TAG: ${{ steps.release.outputs.tag_name }}
          SHA: ${{ steps.release.outputs.sha }}
          URL: ${{ steps.release.outputs.html_url }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -f -a "$TAG" "$SHA" -m "$TAG

          Release notes: $URL"
          git push --force origin "refs/tags/$TAG"
          # Prove it took: objecttype must read `tag`, not `commit`.
          test "$(git for-each-ref "refs/tags/$TAG" --format='%(objecttype)')" = tag

      # The Release above is created with GITHUB_TOKEN, and GitHub starts no workflow for
      # events that token raises — a `release: published` trigger alone would never fire
      # (PR #49 review). workflow_dispatch is the documented exception, so the release
      # hands off explicitly, pinned to the tag so the published tree is exactly the
      # released one.
      - name: Dispatch the publish workflow on the release tag
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run publish.yml --ref "$TAG"
