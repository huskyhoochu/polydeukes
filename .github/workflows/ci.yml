# PR-time test gate (PR #49 review): without it, the publish e2e suites first run at
# release time, where a red burns a version number instead of costing a re-push. Same
# gate sequence as publish.yml minus the upload.
name: test

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No version input: pnpm/action-setup reads the root manifest's pinned packageManager.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo run build

      - run: pnpm -r test
