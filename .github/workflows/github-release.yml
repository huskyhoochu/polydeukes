# GitHub Release from a mirrored tag.
#
# Releases are cut on Forgejo (release-please), and the push mirror carries tags to GitHub
# but never Release objects — so GitHub's release list stalled at the last pre-migration
# release. This workflow closes that gap: when a `v*` tag arrives, it creates the GitHub
# Release for it from the tag's own CHANGELOG section. It creates nothing for a tag whose
# release already exists, so a backfilled or hand-made release is never overwritten.
#
# A release created with the workflow token does not fire `release: published` for other
# workflows, so npm publishing stays the human dispatch that publish.yml documents.
name: github-release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Create the release from the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists; nothing to do"
            exit 0
          fi
          version="${TAG#v}"
          # The section runs from this version's heading to the next `## [` heading.
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) found = 1 }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $version" > notes.md
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md
