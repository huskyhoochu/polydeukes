# npm publish pipeline (DIST-03; research: foundation.research.release-automation §adoption 3).
#
# This repository is a mirror: development and release automation live on the Forgejo
# origin, whose release-please (.forgejo/workflows/release-please.yml there) owns
# versions, tags, and CHANGELOG. This workflow owns ONLY the registry upload, and it
# stays HERE because npm trusted publishing (OIDC, provenance) recognizes github.com —
# not a self-hosted forge. The publish action is a human step after the release tag
# reaches the mirror: `gh workflow run publish.yml --ref <tag>`, or a hand-created
# GitHub Release on that tag (the `release published` trigger). `workflow_dispatch` is
# also the manual valve for the bootstrap publish and retries — npm rejects an
# already-published version, and pnpm skips versions already on the registry, so a
# re-run after a partial upload publishes only what is missing.
#
# The verification gate stands BEFORE the upload and its failure propagates (PRD §5
# invariant 2): `pnpm -r test` includes the publish-pack e2e suite, so a tarball that ships
# broken contents never reaches the registry.
#
# Provenance lives HERE, not in each manifest: the flag is one line in one file rather than
# a field repeated across every package.json. `--no-git-checks` because a release event
# checks out the tag (detached HEAD), which pnpm publish otherwise refuses.
#
# Trusted publishing is registered per package on npmjs.com, and a package that does not
# exist yet has no page to register on — so a NEW package's first version is published by
# hand (see the new-package checklist), and this workflow takes over from its second.
name: publish

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      python_only:
        description: "Publish only Python, using the matching released pdks executable"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # npm provenance, and the OIDC token crates.io trusted publishing trades

jobs:
  publish:
    if: ${{ !inputs.python_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The full history so the tag-integrity check below can see the release tags.
          fetch-depth: 0

      # No version input: pnpm/action-setup reads the root manifest's pinned packageManager.
      - uses: pnpm/action-setup@v6

      # No registry-url: that option writes an .npmrc referencing NODE_AUTH_TOKEN, which
      # crashes npm when the env is absent. Auth is OIDC trusted publishing — each published
      # package names this repo + workflow file on its npmjs.com access page, so a NEW
      # package publishes only once that page has been set up for it.
      - uses: actions/setup-node@v7
        with:
          node-version: 26

      # Refuse a tree that is not exactly a release tag: a dispatch from a branch HEAD
      # would upload unreleased commits under the released version, and provenance would
      # sign the mismatch (PR #49 review).
      - name: Verify HEAD is exactly the tagged release
        run: |
          set -euo pipefail
          TAG="$(git describe --tags --exact-match)"
          test "$TAG" = "v$(node -p 'require("./package.json").version')"

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo run build

      # After build: the adapters and the umbrella resolve their workspace siblings through
      # each sibling's dist/index.d.ts, which a fresh checkout does not have.
      - run: pnpm -r typecheck

      # The publish gate: unit suites plus the tarball-contents e2e suite.
      - run: pnpm -r test

      - run: node scripts/check-docs.mjs

      - run: pnpm -r publish --provenance --access public --no-git-checks

  # The Rust SDK goes to crates.io from the same tag, and only after the npm upload above
  # succeeded: a crates.io version cannot be taken back, and the crate is useless without the
  # `polydeukes` it spawns.
  # Auth is crates.io trusted publishing: the crate's settings page names this repo and this
  # workflow file, and the action trades the job's OIDC token for a short-lived registry
  # token it revokes when the job ends. A crate that does not exist yet has no settings page,
  # so its first version is published by hand. crates.io refuses a version that is already
  # there, so the upload is skipped when the registry has it — a re-run publishes nothing twice.
  publish-crate:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Verify HEAD is exactly the tagged release
        run: |
          set -euo pipefail
          TAG="$(git describe --tags --exact-match)"
          test "$TAG" = "v$(node -p 'require("./package.json").version')"

      - run: pnpm install --frozen-lockfile

      # The crate's end-to-end test spawns the built `pdks`.
      - run: pnpm turbo run build

      - run: cargo test -p polydeukes-sdk

      - name: Skip a version the registry already has
        id: published
        run: |
          set -euo pipefail
          VERSION="$(cargo metadata --no-deps --format-version 1 | node -p 'JSON.parse(require("fs").readFileSync(0)).packages.find((p) => p.name === "polydeukes-sdk").version')"
          # A Cargo.toml the release left behind would otherwise read as already published.
          test "$VERSION" = "$(node -p 'require("./package.json").version')"
          STATUS="$(curl -s -o /dev/null -w '%{http_code}' -A 'polydeukes-publish (github.com/huskyhoochu/polydeukes)' "https://crates.io/api/v1/crates/polydeukes-sdk/$VERSION")"
          echo "exists=$([ "$STATUS" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.published.outputs.exists == 'false'
        id: auth

      - run: cargo publish -p polydeukes-sdk
        if: steps.published.outputs.exists == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # The umbrella as one executable per platform, built from the same tag: Node and the bundle
  # in one file, for a host that has no Node. Each runner builds for its own platform, because
  # the executable is a copy of the runner's node binary with the bundle injected. The suite
  # runs against the built file before it is kept, and only a tag whose full suite passed and
  # reached npm gets executables.
  executables:
    needs: publish
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            asset: pdks-linux-x64
          - runner: macos-latest
            asset: pdks-darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Verify HEAD is exactly the tagged release
        run: |
          set -euo pipefail
          TAG="$(git describe --tags --exact-match)"
          test "$TAG" = "v$(node -p 'require("./package.json").version')"

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo run build

      - run: node packages/polydeukes/scripts/build-sea.mjs "$RUNNER_TEMP/${{ matrix.asset }}"

      - run: pnpm -F polydeukes exec vitest run __tests__/sea-executable.e2e.test.ts
        env:
          PDKS_SEA: ${{ runner.temp }}/${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ runner.temp }}/${{ matrix.asset }}
          if-no-files-found: error

  # The Rust executables, one archive each per platform, for the package managers to install
  # from the Release. Linux links musl statically, so the file runs on any Linux of its
  # architecture whatever its C library. The tests run the release build for the shipped target, so the packed files
  # are the ones tested; CI covers Linux only, so this is where macOS is tested.
  rust-executables:
    if: ${{ !inputs.python_only }}
    strategy:
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The crates' fixture tests run the conformance scripts with node.
      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Verify HEAD is exactly the tagged release
        run: |
          set -euo pipefail
          TAG="$(git describe --tags --exact-match)"
          test "$TAG" = "v$(node -p 'require("./package.json").version')"
          for name in pdks pdks-claude-code pdks-codex pdks-memory; do
            grep -qx "version = \"${TAG#v}\"" "packages/$name/Cargo.toml"
          done

      - run: rustup target add ${{ matrix.target }}

      - run: cargo test --release --locked --target ${{ matrix.target }} -p pdks -p pdks-claude-code -p pdks-codex -p pdks-memory

      - run: cargo build --release --locked --target ${{ matrix.target }} -p pdks -p pdks-claude-code -p pdks-codex -p pdks-memory

      - name: Pack each executable
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          VERSION="$(node -p 'require("./package.json").version')"
          for name in pdks pdks-claude-code pdks-codex pdks-memory; do
            scripts/pack-rust-executable.sh "$name" "$TARGET" "$VERSION" "target/$TARGET/release/$name" "$RUNNER_TEMP/rust"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: rust-${{ matrix.target }}
          path: ${{ runner.temp }}/rust/*
          if-no-files-found: error

  # The four executable crates go to crates.io from the same tag once both targets' tests
  # passed, since a crates.io version cannot be taken back. `cargo binstall` then finds the
  # Release archives above through each crate's `repository`. Auth, the first hand-published
  # version, and skipping a version the registry already has work as in `publish-crate`.
  publish-rust-crates:
    needs: rust-executables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # rust-executables checked the four versions against the tag on this same commit.
      - name: List the crates the registry does not have yet
        id: missing
        run: |
          set -euo pipefail
          TAG="$(git describe --tags --exact-match)"
          args=""
          for name in pdks pdks-claude-code pdks-codex pdks-memory; do
            STATUS="$(curl --retry 3 -sS -o /dev/null -w '%{http_code}' -A 'polydeukes-publish (github.com/huskyhoochu/polydeukes)' "https://crates.io/api/v1/crates/$name/${TAG#v}")"
            case "$STATUS" in
              200) ;;
              404) args="$args -p $name" ;;
              *) echo "Unexpected crates.io status $STATUS for $name" >&2; exit 1 ;;
            esac
          done
          echo "args=$args" >> "$GITHUB_OUTPUT"

      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.missing.outputs.args != ''
        id: auth

      # One invocation packages and verifies every crate before uploading any of them.
      - if: steps.missing.outputs.args != ''
        run: cargo publish --locked ${{ steps.missing.outputs.args }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # The npm names `polydeukes`, `@polydeukes/adapter-claude-code`, `@polydeukes/adapter-codex`
  # and `@polydeukes/memory` carry the same Rust executables, packed from the archives attached to
  # the tag's Release with a Node launcher that runs the one for the current platform, so each
  # upload carries the bytes the Release holds at that moment. Each package is installed and run on
  # every platform it ships before any of them is uploaded.
  npm-packages:
    needs: [rust-executables, release-assets]
    strategy:
      matrix:
        runner: [macos-latest, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Download the Release archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release download "$GITHUB_REF_NAME" --pattern '*.tar.gz' --dir archives

      # The Release must hold exactly the archives this run built and tested.
      - uses: actions/download-artifact@v4
        with:
          pattern: rust-*
          path: built
          merge-multiple: true

      - run: diff -r built archives

      - run: node scripts/pack-npm-packages.mjs archives "$(node -p 'require("./package.json").version')" "$RUNNER_TEMP/npm"

      - run: node scripts/verify-npm-packages.mjs "$RUNNER_TEMP/npm"

  # Auth is npm trusted publishing (OIDC), registered for all four names. The upload is skipped
  # for a version the registry already has, so a re-run publishes only what is missing.
  publish-npm-binaries:
    needs: npm-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Download the Release archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release download "$GITHUB_REF_NAME" --pattern '*.tar.gz' --dir archives

      # The Release must hold exactly the archives this run built and tested.
      - uses: actions/download-artifact@v4
        with:
          pattern: rust-*
          path: built
          merge-multiple: true

      - run: diff -r built archives

      - run: node scripts/pack-npm-packages.mjs archives "$(node -p 'require("./package.json").version')" "$RUNNER_TEMP/npm"

      - name: Publish the versions the registry does not have yet
        run: |
          set -euo pipefail
          for dir in "$RUNNER_TEMP"/npm/*; do
            NAME="$(node -p "require('$dir/package.json').name")"
            VERSION="$(node -p "require('$dir/package.json').version")"
            STATUS="$(curl --retry 3 -sS -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/$NAME/$VERSION")"
            case "$STATUS" in
              200) ;;
              404) npm publish --provenance --access public "$dir" ;;
              *) echo "Unexpected npm registry status $STATUS for $NAME" >&2; exit 1 ;;
            esac
          done

  publish-python:
    needs: executables
    if: ${{ !cancelled() && (needs.executables.result == 'success' || inputs.python_only) }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"

      - uses: actions/download-artifact@v4
        if: ${{ !inputs.python_only }}
        with:
          name: pdks-linux-x64
          path: executable

      - name: Verify tag, source and Python package versions
        env:
          PYTHON_ONLY: ${{ inputs.python_only || false }}
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("packages/sdk-python/pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$PYTHON_ONLY" = true ]; then
            TAG="$(git describe --tags --exact-match --match 'sdk-python-v*')"
            test "$TAG" = "sdk-python-v$VERSION"
            # Python-only publication requires the other packages to match the released sources.
            git diff --exit-code "v$VERSION" HEAD -- 'packages/*/src/**' 'packages/*/schema/**' 'packages/*/scripts/**' 'packages/*/package.json' 'packages/sdk-rust/Cargo.toml' 'packages/sdk-rust/build.rs' ':!packages/sdk-python/**'
          else
            TAG="$(git describe --tags --exact-match --match 'v*')"
            test "$TAG" = "v$VERSION"
          fi
          test "$VERSION" = "$(python -c 'import json; print(json.load(open("package.json"))["version"])')"

      - name: Fetch the released executable for Python-only publication
        if: ${{ inputs.python_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("packages/sdk-python/pyproject.toml", "rb"))["project"]["version"])')"
          gh release download "v$VERSION" --pattern pdks-linux-x64 --dir executable
          DIGEST="$(gh api "repos/$GH_REPO/releases/tags/v$VERSION" --jq '.assets[] | select(.name == "pdks-linux-x64") | .digest')"
          echo "${DIGEST#sha256:}  executable/pdks-linux-x64" | sha256sum --check

      - run: chmod +x executable/pdks-linux-x64

      - run: uv sync --project packages/sdk-python --locked --python 3.14

      - run: uv run --project packages/sdk-python --locked ruff check packages/sdk-python

      - run: uv run --project packages/sdk-python --locked ruff format --check packages/sdk-python

      - name: Verify installed distributions against the executable artifact
        run: >-
          uv run --project packages/sdk-python --locked python
          packages/sdk-python/scripts/verify.py
          --executable "$PWD/executable/pdks-linux-x64"
          --python 3.12 --python 3.14 --python 3.15

      - run: uv build --project packages/sdk-python --out-dir dist

      - name: Skip a version PyPI already has
        id: published
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("packages/sdk-python/pyproject.toml", "rb"))["project"]["version"])')"
          STATUS="$(curl --retry 3 -sS -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/polydeukes-sdk/$VERSION/json")"
          case "$STATUS" in
            200) echo 'exists=true' >> "$GITHUB_OUTPUT" ;;
            404) echo 'exists=false' >> "$GITHUB_OUTPUT" ;;
            *) echo "Unexpected PyPI status $STATUS" >&2; exit 1 ;;
          esac

      - uses: pypa/gh-action-pypi-publish@v1.14.3
        if: steps.published.outputs.exists == 'false'

  # Release objects do not cross the mirror, so the tag's GitHub Release is made here when it
  # does not exist yet; the executables replace any earlier upload of the same name. Each set is
  # attached only when every job that built it succeeded, so a failure in one does not hold back
  # the other.
  release-assets:
    needs: [executables, rust-executables]
    if: ${{ !cancelled() && (needs.executables.result == 'success' || needs.rust-executables.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Attach the executables to the tag's Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SEA: ${{ needs.executables.result }}
          RUST: ${{ needs.rust-executables.result }}
        run: |
          set -euo pipefail
          files=()
          if [ "$SEA" = success ]; then files+=(assets/pdks-linux-x64 assets/pdks-darwin-arm64); fi
          if [ "$RUST" = success ]; then files+=(assets/*.tar.gz); fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "$TAG" --notes "Single executables of pdks for this release."
          gh release upload "$TAG" "${files[@]}" --clobber
