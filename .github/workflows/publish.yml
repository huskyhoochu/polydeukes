# npm publish pipeline (DIST-03; research: foundation.research.release-automation §adoption 3).
#
# This repository is a mirror: development and release automation live on the Forgejo
# origin, whose release-please (.forgejo/workflows/release-please.yml there) owns
# versions, tags, and CHANGELOG. This workflow owns ONLY the registry upload, and it
# stays HERE because npm trusted publishing (OIDC, provenance) recognizes github.com —
# not a self-hosted forge. The publish action is a human step after the release tag
# reaches the mirror: `gh workflow run publish.yml --ref <tag>`, or a hand-created
# GitHub Release on that tag (the `release published` trigger). `workflow_dispatch` is
# also the manual valve for the bootstrap publish and retries — npm rejects an
# already-published version, and pnpm skips versions already on the registry, so a
# re-run after a partial upload publishes only what is missing.
#
# The verification gate stands BEFORE the upload and its failure propagates (PRD §5
# invariant 2): `pnpm -r test` includes the publish-pack and clean-install e2e suites, so a
# tarball that ships broken contents or fails a real install never reaches the registry.
#
# Provenance lives HERE, not in each manifest: the flag is one line in one file rather than
# a field repeated across every package.json. `--no-git-checks` because a release event
# checks out the tag (detached HEAD), which pnpm publish otherwise refuses.
#
# Trusted publishing is registered per package on npmjs.com, and a package that does not
# exist yet has no page to register on — so a NEW package's first version is published by
# hand (see the new-package checklist), and this workflow takes over from its second.
name: publish

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance, and the OIDC token crates.io trusted publishing trades

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The full history so the tag-integrity check below can see the release tags.
          fetch-depth: 0

      # No version input: pnpm/action-setup reads the root manifest's pinned packageManager.
      - uses: pnpm/action-setup@v6

      # No registry-url: that option writes an .npmrc referencing NODE_AUTH_TOKEN, which
      # crashes npm when the env is absent. Auth is OIDC trusted publishing — each published
      # package names this repo + workflow file on its npmjs.com access page, so a NEW
      # package publishes only once that page has been set up for it.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Refuse a tree that is not exactly a release tag: a dispatch from a branch HEAD
      # would upload unreleased commits under the released version, and provenance would
      # sign the mismatch (PR #49 review).
      - name: Verify HEAD is exactly the tagged release
        run: |
          set -euo pipefail
          TAG="$(git describe --tags --exact-match)"
          test "$TAG" = "v$(node -p 'require("./package.json").version')"

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo run build

      # After build: the adapters and the umbrella resolve their workspace siblings through
      # each sibling's dist/index.d.ts, which a fresh checkout does not have.
      - run: pnpm -r typecheck

      # The publish gate: unit suites plus the two DIST-03 e2e suites (tarball contents,
      # clean-environment install → init → live judgments).
      - run: pnpm -r test

      - run: node scripts/check-docs.mjs

      - run: pnpm -r publish --provenance --access public --no-git-checks

  # The Rust SDK goes to crates.io from the same tag, and only after the npm upload above
  # succeeded: a crates.io version cannot be taken back, and the crate is useless without the
  # `polydeukes` it spawns.
  # Auth is crates.io trusted publishing: the crate's settings page names this repo and this
  # workflow file, and the action trades the job's OIDC token for a short-lived registry
  # token it revokes when the job ends. A crate that does not exist yet has no settings page,
  # so its first version is published by hand. crates.io refuses a version that is already
  # there, so the upload is skipped when the registry has it — a re-run publishes nothing twice.
  publish-crate:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Verify HEAD is exactly the tagged release
        run: |
          set -euo pipefail
          TAG="$(git describe --tags --exact-match)"
          test "$TAG" = "v$(node -p 'require("./package.json").version')"

      - run: pnpm install --frozen-lockfile

      # The crate's end-to-end test spawns the built `pdks`.
      - run: pnpm turbo run build

      - run: cargo test --manifest-path packages/sdk-rust/Cargo.toml

      - name: Skip a version the registry already has
        id: published
        run: |
          set -euo pipefail
          VERSION="$(cargo metadata --manifest-path packages/sdk-rust/Cargo.toml --no-deps --format-version 1 | node -p 'JSON.parse(require("fs").readFileSync(0)).packages[0].version')"
          # A Cargo.toml the release left behind would otherwise read as already published.
          test "$VERSION" = "$(node -p 'require("./package.json").version')"
          STATUS="$(curl -s -o /dev/null -w '%{http_code}' -A 'polydeukes-publish (github.com/huskyhoochu/polydeukes)' "https://crates.io/api/v1/crates/polydeukes-sdk/$VERSION")"
          echo "exists=$([ "$STATUS" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.published.outputs.exists == 'false'
        id: auth

      - run: cargo publish --manifest-path packages/sdk-rust/Cargo.toml
        if: steps.published.outputs.exists == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # The umbrella as one executable per platform, built from the same tag: Node and the bundle
  # in one file, for a host that has no Node. Each runner builds for its own platform, because
  # the executable is a copy of the runner's node binary with the bundle injected. The suite
  # runs against the built file before it is kept, and only a tag whose full suite passed and
  # reached npm gets executables.
  executables:
    needs: publish
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            asset: pdks-linux-x64
          - runner: macos-latest
            asset: pdks-darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Verify HEAD is exactly the tagged release
        run: |
          set -euo pipefail
          TAG="$(git describe --tags --exact-match)"
          test "$TAG" = "v$(node -p 'require("./package.json").version')"

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo run build

      - run: node packages/polydeukes/scripts/build-sea.mjs "$RUNNER_TEMP/${{ matrix.asset }}"

      - run: pnpm -F polydeukes exec vitest run __tests__/sea-executable.e2e.test.ts
        env:
          PDKS_SEA: ${{ runner.temp }}/${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ runner.temp }}/${{ matrix.asset }}
          if-no-files-found: error

  # Release objects do not cross the mirror, so the tag's GitHub Release is made here when it
  # does not exist yet; the executables replace any earlier upload of the same name.
  release-assets:
    needs: executables
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Attach the executables to the tag's Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "$TAG" --notes "Single executables of pdks for this release."
          gh release upload "$TAG" assets/pdks-linux-x64 assets/pdks-darwin-arm64 --clobber
