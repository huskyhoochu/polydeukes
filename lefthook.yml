# 생성 훅이 lefthook 실행 파일을 찾지 못하면 커밋을 무판정 통과시키는 대신 실패한다
# (감사 M2의 fail-open 꼬리 — CONFIG-08이 봉쇄).
assert_lefthook_installed: true

# biome는 node_modules/.bin/biome로 직접 호출한다.
# `pnpm exec biome`는 일부 환경에서 네이티브 바이너리 spawn에 실패하며
# "possibly out of memory"로 오보한다(실제 OOM 아님). .bin 직접 호출은 정상.
# covenant가 biome보다 먼저(priority 1) 실패해야 차단 사유가 명확하다(ADAPTER-git §4.5).
# piped: 판정이 차단하면 이후 단계는 돌지 않는다. 유예 밸브는 bin이 /dev/tty로 직접 연다 —
# 터미널 앞의 인간에게만 열리고, 에이전트가 spawn한 git에는 TTY가 없어 닿지 않는다.
pre-commit:
  piped: true
  commands:
    covenant:
      priority: 1
      # interactive: 스피너·출력 캡처가 TTY 유예 프롬프트를 가리고 입력 대기만 남는 것을
      # 막는다(2026-07-22 첫 실사용 실측 — waiver-observable-behaviour 참조).
      interactive: true
      run: ./node_modules/.bin/pdks covenant check
    check:
      priority: 2
      run: ./node_modules/.bin/biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    format:
      priority: 3
      run: ./node_modules/.bin/biome format --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    # 마크다운은 biome 소관 밖이라 markdownlint-cli2가 잇는다. 규칙은 루트
    # .markdownlint.yaml 하나가 정본이고, 편집기(LazyVim lang.markdown)와 이 훅이 같은
    # 파일을 읽으므로 두 표면의 판정이 어긋나지 않는다.
    markdownlint:
      priority: 4
      run: ./node_modules/.bin/markdownlint-cli2 {staged_files}
      glob: '*.md'

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
