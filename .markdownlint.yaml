# House markdown style — read by markdownlint-cli2 (editor plugins and the pre-commit hook
# alike). Rules below are OFF where the default disagrees with an established convention of
# this repository, not to hide defects; everything else stays at its default severity.

# Prose wraps at 100 columns. Tables, code blocks, and headings are exempt — their width
# is content, not formatting — and a line that has no break point past the limit (a long
# URL) passes under the rule's default mode.
MD013:
  line_length: 100
  tables: false
  code_blocks: false
  headings: false

# release-please generates asterisk bullet lists into CHANGELOG.md next to hand-written
# dash lists; a single style cannot cover generated + authored content.
MD004: false

# Stable explicit anchors intentionally sit directly above headings, so requiring an
# additional blank line there adds noise without improving rendering.
MD022: false

# Inline HTML is allowed for stable anchors and documentation markup.
MD033: false

# Emphasis is spelled with asterisks throughout (underscore forms render identically and
# are converted on sight).
MD049:
  style: asterisk

# Tables use compact separator rows (|---|---|) with padded content cells throughout.
MD060: false

# release-please output separates its sections with double blank lines.
MD012:
  maximum: 2
