[package]
name = "pdks"
version = "0.22.0"
edition = "2024"
rust-version = "1.89"
authors.workspace = true
license.workspace = true
description = "The Polydeukes covenant judge: covenant check, init, explain and docs, with pdks-<name> executables on PATH run as pdks <name>."
repository.workspace = true
readme = "README.md"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
serde-saphyr = "2"
sha2 = "0.11"
regress = "0.12"
unicode-normalization = "0.1"

[build-dependencies]
serde_json = "1"
