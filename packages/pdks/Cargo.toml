[package]
name = "pdks"
version = "0.20.1"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
serde-saphyr = "2"
sha2 = "0.11"
regress = "0.12"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
indexing_slicing = "warn"
string_slice = "warn"
get_unwrap = "warn"
unwrap_in_result = "warn"
let_underscore_must_use = "warn"
map_err_ignore = "warn"
print_stdout = "warn"
dbg_macro = "warn"
