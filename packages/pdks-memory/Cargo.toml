[package]
name = "pdks-memory"
version = "0.23.0"
edition = "2024"
rust-version = "1.89"
authors.workspace = true
license = "MIT AND CC-BY-SA-4.0"
description = "The Polydeukes memory extension, run as pdks memory: answers from the markdown files on every run and keeps no index file."
repository.workspace = true
readme = "README.md"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
serde-saphyr = "2"
regress = "0.12"
globset = "0.4"
fst = "0.4"
brotli-decompressor = { version = "5", default-features = false, features = ["std", "disable-timer"] }

[dev-dependencies]
tempfile = "3"
