[package]
name = "pdks-memory"
version = "0.20.1"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
serde-saphyr = "2"
regress = "0.12"
globset = "0.4"
fst = "0.4"
brotli-decompressor = { version = "5", default-features = false, features = ["std", "disable-timer"] }

[dev-dependencies]
tempfile = "3"
