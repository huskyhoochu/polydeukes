[package]
name = "polydeukes-sdk"
version = "0.15.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Polydeukes SDK for Rust — hands a covenant input or a change set to `pdks covenant check` and returns the verdict as a value, and ingests and searches memory through `pdks memory`."
repository = "https://github.com/huskyhoochu/polydeukes"
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
# Exact: the generated text is compared byte for byte.
typify = "=0.8.0"
schemars = "0.8"
prettyplease = "=0.3.0"
syn = "3"
