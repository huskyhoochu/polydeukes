[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "polydeukes-sdk"
version = "0.20.0"
description = "Call the Polydeukes covenant and memory commands from Python"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Polydeukes contributors"}]
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/huskyhoochu/polydeukes"
Documentation = "https://polydeukes.vercel.app"

[dependency-groups]
dev = [
  "datamodel-code-generator==0.86.0",
  "pyright==1.1.414",
  "ruff==0.17.1",
  "build==1.6.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/polydeukes_sdk"]

[tool.hatch.build.targets.sdist]
include = ["src/", "README.md", "README.ko.md", "LICENSE", "pyproject.toml"]

[tool.pyright]
include = ["src", "tests/typing/valid.py"]
extraPaths = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["src/polydeukes_sdk/ir.py", "src/polydeukes_sdk/memory.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
combine-as-imports = true
